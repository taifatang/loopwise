<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Loopwise logo">
  <defs>
    <marker id="head" viewBox="0 0 8 8" refX="4.5" refY="4" markerWidth="8" markerHeight="8"
            markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L8,4 L0,8 L1.8,4 z" fill="#1a1a1a" />
    </marker>
  </defs>
  <!-- badge -->
  <rect width="32" height="32" rx="8" fill="#ffa116" />
  <!-- loop arrow: iterating across the array -->
  <path d="M7.5 16.5 C7.5 5.5, 24.5 5.5, 24.5 12.5" fill="none" stroke="#1a1a1a"
        stroke-width="2.2" stroke-linecap="round" marker-end="url(#head)" />
  <!-- array cells; middle one is the current element (i) -->
  <rect x="4.6" y="18.6" width="5.8" height="6.8" rx="1.4" fill="none" stroke="#1a1a1a" stroke-width="1.6" />
  <rect x="12.6" y="18.6" width="6.8" height="6.8" rx="1.4" fill="#1a1a1a" stroke="#1a1a1a" stroke-width="1.6" />
  <rect x="21.6" y="18.6" width="5.8" height="6.8" rx="1.4" fill="none" stroke="#1a1a1a" stroke-width="1.6" />
</svg>
